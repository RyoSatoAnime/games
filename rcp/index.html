<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RC Pinball</title>
<style>
  html, body {
    margin: 0;
    background: #000;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-shell {
    position: relative;
    aspect-ratio: 740 / 1280;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    width: min(740px, 100vw, calc(100vh * 740 / 1280));
    width: min(740px, 100vw, calc(100dvh * 740 / 1280));
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #rsg-link {
    position: absolute;
    left: 50%;
    top: 22.27%;
    transform: translate(-50%, -50%);
    z-index: 2;
    margin: 0;
    padding: 0.55em 0.85em;
    color: #fff;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: min(18px, calc(100vw * 18 / 740), calc(100dvh * 18 / 1280));
    line-height: 1.2;
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    
    -webkit-text-stroke:
      min(
        6px,
        calc(100vw * 6 / 740),
        calc(100dvh * 6 / 1280)
      )
      #171717;
    paint-order: stroke fill;
    
    -webkit-tap-highlight-color: transparent;
    visibility: hidden;
    pointer-events: none;
  }
  #rsg-link.is-visible {
    visibility: visible;
    pointer-events: auto;
  }
  #rsg-link:hover,
  #rsg-link:focus-visible {
    text-decoration: none;
  }
  
  #rsg-link::after {
    content: "";
    position: absolute;
    left: 0.85em;
    right: 0.85em;
    bottom: 0.4em;
    height: 2px;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }
  
  #rsg-link:hover::after,
  #rsg-link:focus-visible::after {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="game-shell">
  <canvas id="game" width="740" height="1280"></canvas>
  <a
    id="rsg-link"
    href="../index.html"
    aria-label="Find more games on RSG"
    aria-hidden="true"
    tabindex="-1"
  >
    MORE GAMES at RSG — CLICK / TAP
  </a>
</div>
<script src="./rcp_table1.js"></script>
<script src="./rcp_table2.js"></script>
<script src="./rcp_table3.js"></script>
<script src="./rcp_table777.js"></script>
<script src="./rcp_melodies.js"></script>
<script src="./rcp_audio.js"></script>
<script src="./rcp_game.js"></script>
</body>
</html>
